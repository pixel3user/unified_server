[project]
name = "unified-server"
version = "0.1.0"
description = "Unified MuseTalk + PersonaPlex inference server"
requires-python = ">=3.10"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "numpy",
    "opencv-python-headless",
    "aiohttp",
    "scipy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "gpu: marks tests that require CUDA (deselect with '-m not gpu')",
    "slow: marks tests that take >10s (deselect with '-m not slow')",
    "soak: marks long-running soak tests (deselect with '-m not soak')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
